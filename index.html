<!DOCTYPE html>
<html lang="ur-Latn" dir="ltr" data-theme="parchment" data-mode="teacher" data-lang="hinglish">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Muallim ul-Qur'an: Unit 1 Lesson 1</title>
  <meta name="description" content="Offline-first interactive Muallim ul-Qur'an Arabic workbook with 4-language translations, Qari recitation, morphology builder, model exams, and spaced repetition.">
  <meta name="theme-color" id="meta-theme-color" content="#FAF7F2">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <!-- Zero-FOUC Theme, Mode, Language & Typography Initializer -->
  <script>
    (function () {
      try {
        var rawTheme = localStorage.getItem('muallim_theme') || 'parchment';
        var themeMap = { light: 'parchment', dark: 'night', parchment: 'parchment', night: 'night', sepia: 'sepia' };
        var theme = themeMap[rawTheme] || 'parchment';
        var rawMode = localStorage.getItem('muallim_mode') || 'teacher';
        var mode = rawMode === 'student' ? 'student' : 'teacher';
        var rawLang = localStorage.getItem('muallim_lang') || 'hinglish';
        var validLangs = { hinglish: 'hinglish', en: 'en', ur: 'ur', hi: 'hi' };
        var lang = validLangs[rawLang] || (['bn', 'ko', 'zh', 'es'].indexOf(rawLang) >= 0 ? 'en' : 'hinglish');
        var htmlLangMap = { hinglish: 'ur-Latn', en: 'en', ur: 'ur', hi: 'hi' };
        var rawScale = parseInt(localStorage.getItem('muallim_ar_scale') || '26', 10);
        var arScale = isNaN(rawScale) ? 26 : Math.min(42, Math.max(18, rawScale));
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-mode', mode);
        root.setAttribute('data-lang', lang);
        root.setAttribute('lang', htmlLangMap[lang] || 'ur-Latn');
        root.style.setProperty('--arabic-scale', arScale + 'px');
        var metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) {
          var metaColors = { parchment: '#FAF7F2', sepia: '#F2E7D5', night: '#161922' };
          metaTheme.setAttribute('content', metaColors[theme] || '#FAF7F2');
        }
      } catch (err) {
        if (window.console && console.warn) console.warn('Theme init skipped:', err);
      }
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to lesson content</a>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-start">
      <a href="#u1/l1" class="brand-mark" aria-label="Muallim ul-Qur'an home">
        <img src="./icons/icon.svg" alt="" class="brand-logo-img" width="30" height="30">
        <span class="brand-name">Muallim</span>
      </a>
      <button type="button" id="btn-lesson-picker" class="picker-trigger" aria-haspopup="dialog" aria-label="Choose Unit and Lesson">
        <span id="current-lesson-label" class="tabular-nums">Unit 1, Lesson 1</span>
        <svg class="icon-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="header-end">
      <div id="streak-pill" class="streak-pill tabular-nums" title="Daily study streak" aria-label="Study streak">
        <svg class="streak-flame" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12.7 2.3a1 1 0 0 0-1.4.2C8.9 5.5 7 8.4 7 12a5 5 0 0 0 10 0c0-1.6-.6-3.1-1.5-4.4a1 1 0 0 0-1.6.1 3.7 3.7 0 0 1-.8 1.1c-.1-2.3-.3-4.6-.4-6.5zm-.7 14.2a2.5 2.5 0 0 1-2.5-2.5c0-1.2.5-2.3 1.4-3.4.3.9.9 1.6 1.7 2 .4.2.9.1 1.2-.2.3.5.7 1.1.7 1.6a2.5 2.5 0 0 1-2.5 2.5z"/>
        </svg>
        <span id="streak-count-val">0d</span>
      </div>

      <button type="button" id="btn-header-mode" class="header-chip-btn desktop-only" aria-pressed="false" title="Toggle Student Mode (Space to reveal)">
        <span id="header-mode-label">Student Mode</span>
      </button>

      <button type="button" aria-label="Search workbook (/)" title="Search (/)" id="btn-header-search" class="icon-btn desktop-only">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button type="button" aria-label="Open SRS Flashcard Drill" title="SRS Flashcards and Drill" id="btn-header-drill" class="icon-btn desktop-only">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="6" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M7 4h12a2 2 0 0 1 2 2v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <button type="button" aria-label="Open Settings and Sync" title="Settings and Sync" id="btn-open-settings" class="icon-btn" aria-haspopup="dialog">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.4 1.11H21a2 2 0 1 1 0 4h-.09c-.63.09-1.14.51-1.51 1.11z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Reading Area -->
  <main id="main-content" class="app-main">
    <div id="resume-banner-mount" aria-live="polite"></div>

    <div id="lesson-content-mount">
      <!-- Exact-height initial skeleton matching lesson banner + visual + grid (CLS < 0.05) -->
      <div class="lesson-skeleton" aria-busy="true" aria-label="Loading lesson">
        <div class="skeleton-block skeleton-banner"></div>
        <div class="skeleton-block skeleton-visual"></div>
        <div class="skeleton-grid">
          <div class="skeleton-block skeleton-card"></div>
          <div class="skeleton-block skeleton-card"></div>
          <div class="skeleton-block skeleton-card"></div>
          <div class="skeleton-block skeleton-card"></div>
        </div>
      </div>
    </div>

    <div id="bottom-nav-mount"></div>
  </main>

  <!-- Mobile Thumb-Friendly Bottom Bar -->
  <nav class="mobile-bottom-bar" aria-label="Mobile study controls">
    <button type="button" id="mbar-prev" class="mbar-btn" aria-label="Previous lesson">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Prev</span>
    </button>

    <button type="button" id="mbar-student" class="mbar-btn" aria-pressed="false" aria-label="Toggle Student Hide or Reveal">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
      </svg>
      <span id="mbar-student-label">Hide</span>
    </button>

    <button type="button" id="mbar-drill" class="mbar-btn" aria-label="Open SRS Drill">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="6" width="14" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M7 4h12a2 2 0 0 1 2 2v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Drill</span>
    </button>

    <button type="button" id="mbar-search" class="mbar-btn" aria-label="Open Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
        <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>Search</span>
    </button>

    <button type="button" id="mbar-next" class="mbar-btn" aria-label="Next lesson">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Next</span>
    </button>
  </nav>

  <!-- Toast Notification -->
  <div id="app-toast" class="app-toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- DIALOG 1 of 5: Lesson Picker -->
  <dialog id="lesson-picker-dialog" class="app-dialog" aria-labelledby="picker-dialog-title">
    <div class="dialog-header">
      <h2 id="picker-dialog-title" class="dialog-title">Units &amp; Lessons</h2>
      <button type="button" class="icon-btn dialog-close-btn" data-close-dialog="lesson-picker-dialog" aria-label="Close lesson picker">✕</button>
    </div>
    <div class="dialog-body">
      <div id="picker-bookmark-mount"></div>
      <div id="picker-units-mount" class="unit-tabs-grid" role="tablist" aria-label="Curriculum Units"></div>
      <div id="picker-unit-summary" class="picker-unit-summary"></div>
      <div id="picker-lessons-mount" class="lesson-picker-grid"></div>
      <section class="picker-quick-launch" aria-label="Assessments and Curriculum Explorers">
        <span class="field-label">Model Exams, Mushaf Check &amp; Spiral Explorer</span>
        <div class="quick-launch-grid">
          <button type="button" class="btn-secondary btn-sm" data-quick-route="#exam/vol1">Vol. 1 Exam (50m)</button>
          <button type="button" class="btn-secondary btn-sm" data-quick-route="#exam/u4">Unit 4 Exam (50m)</button>
          <button type="button" class="btn-secondary btn-sm" data-quick-route="#exam/u5">Unit 5 Exam (60m)</button>
          <button type="button" class="btn-secondary btn-sm" data-quick-route="#exam/u7">Unit 7 Exam (100m)</button>
          <button type="button" class="btn-secondary btn-sm" data-quick-route="#mushaf-check">Mushaf 85% Showcase</button>
          <button type="button" class="btn-secondary btn-sm" data-quick-route="#spiral">9-Pillar &amp; Root Explorer</button>
        </div>
      </section>
    </div>
  </dialog>

  <!-- DIALOG 2 of 5: Quick Search -->
  <dialog id="search-dialog" class="app-dialog" aria-labelledby="search-dialog-title">
    <div class="dialog-header">
      <h2 id="search-dialog-title" class="dialog-title">Quick Search</h2>
      <button type="button" class="icon-btn dialog-close-btn" data-close-dialog="search-dialog" aria-label="Close search">✕</button>
    </div>
    <div class="dialog-body">
      <div class="search-field-group">
        <label for="search-input" class="field-label">Search Arabic, transliteration, root, or translation</label>
        <div class="search-input-wrap">
          <input type="text" id="search-input" class="text-input" placeholder="e.g. kitab, sabr, يَعْبُدُ, رحمت" autocomplete="off">
          <button type="button" id="search-clear-btn" class="btn-ghost btn-sm" hidden>Clear</button>
        </div>
      </div>
      <div id="search-status-line" class="search-status-line tabular-nums"></div>
      <div id="search-results-mount" class="search-results-list"></div>
    </div>
  </dialog>

  <!-- DIALOG 3 of 5: SRS Flashcard / Drill -->
  <dialog id="drill-dialog" class="app-dialog" aria-labelledby="drill-dialog-title">
    <div class="dialog-header">
      <h2 id="drill-dialog-title" class="dialog-title">SRS Flashcard Drill</h2>
      <button type="button" class="icon-btn dialog-close-btn" data-close-dialog="drill-dialog" aria-label="Close flashcard drill">✕</button>
    </div>
    <div class="dialog-body" id="drill-dialog-body"></div>
  </dialog>

  <!-- DIALOG 4 of 5: Practice Quiz & Morphology Builder -->
  <dialog id="practice-dialog" class="app-dialog" aria-labelledby="practice-dialog-title">
    <div class="dialog-header">
      <div class="dialog-title-group">
        <h2 id="practice-dialog-title" class="dialog-title">Practice Studio</h2>
        <span id="practice-lesson-tag" class="dialog-subtitle tabular-nums">Unit 1, Lesson 1</span>
      </div>
      <button type="button" class="icon-btn dialog-close-btn" data-close-dialog="practice-dialog" aria-label="Close practice studio">✕</button>
    </div>
    <div class="dialog-subnav">
      <div class="segmented-tabs" role="tablist" aria-label="Practice mode">
        <button type="button" id="tab-practice-quiz" class="seg-tab active" role="tab" aria-selected="true">Practice Quiz</button>
        <button type="button" id="tab-practice-morph" class="seg-tab" role="tab" aria-selected="false">Morphology Builder</button>
      </div>
    </div>
    <div class="dialog-body" id="practice-dialog-body"></div>
    <div class="dialog-footer-launch" aria-label="Summative Model Exams and Explorers">
      <span class="field-label">Summative Exams &amp; Explorers</span>
      <div class="quick-launch-grid">
        <button type="button" class="btn-secondary btn-sm" data-quick-route="#exam/vol1">Vol. 1 Exam</button>
        <button type="button" class="btn-secondary btn-sm" data-quick-route="#exam/u4">Unit 4 Exam</button>
        <button type="button" class="btn-secondary btn-sm" data-quick-route="#exam/u5">Unit 5 Exam</button>
        <button type="button" class="btn-secondary btn-sm" data-quick-route="#exam/u7">Unit 7 Exam</button>
        <button type="button" class="btn-secondary btn-sm" data-quick-route="#mushaf-check">Mushaf 85%</button>
        <button type="button" class="btn-secondary btn-sm" data-quick-route="#spiral">9-Pillar Explorer</button>
      </div>
    </div>
  </dialog>

  <!-- DIALOG 5 of 5: Settings & Sync -->
  <dialog id="settings-dialog" class="app-dialog" aria-labelledby="settings-dialog-title">
    <div class="dialog-header">
      <h2 id="settings-dialog-title" class="dialog-title">Settings &amp; Sync</h2>
      <button type="button" class="icon-btn dialog-close-btn" data-close-dialog="settings-dialog" aria-label="Close settings">✕</button>
    </div>
    <div class="dialog-subnav">
      <div class="segmented-tabs" role="tablist" aria-label="Settings sections">
        <button type="button" id="tab-settings-prefs" class="seg-tab active" role="tab" aria-selected="true">Reading</button>
        <button type="button" id="tab-settings-starred" class="seg-tab" role="tab" aria-selected="false">Starred (<span id="settings-starred-count" class="tabular-nums">0</span>)</button>
        <button type="button" id="tab-settings-sync" class="seg-tab" role="tab" aria-selected="false">Backup &amp; Sync</button>
      </div>
    </div>
    <div class="dialog-body" id="settings-dialog-body"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
