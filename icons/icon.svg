<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Muallim ul-Qur'an Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4D3B"/>
      <stop offset="55%" stop-color="#14372A"/>
      <stop offset="100%" stop-color="#0D261D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D794"/>
      <stop offset="50%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#B08942"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#EFE6D5"/>
    </linearGradient>
  </defs>

  <!-- Rounded emerald squircle background (safe for maskable icons) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle Islamic 8-point Rub el Hizb geometric medallion -->
  <g transform="translate(256 246)" opacity="0.22" fill="none" stroke="url(#gold)" stroke-width="5">
    <rect x="-150" y="-150" width="300" height="300" rx="22"/>
    <rect x="-150" y="-150" width="300" height="300" rx="22" transform="rotate(45)"/>
  </g>

  <!-- Concentric inner gold border -->
  <rect x="28" y="28" width="456" height="456" rx="90" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.45"/>

  <!-- Open Mushaf / Book Cradle (lower emblem) -->
  <g transform="translate(256 332)">
    <!-- Left page -->
    <path d="M-8 14 C-46 -6 -98 -10 -144 4 L-144 -68 C-98 -82 -46 -76 -8 -54 Z" fill="url(#cream)" opacity="0.96"/>
    <!-- Right page -->
    <path d="M8 14 C46 -6 98 -10 144 4 L144 -68 C98 -82 46 -76 8 -54 Z" fill="url(#cream)" opacity="0.96"/>
    <!-- Subtle page lines -->
    <path d="M-116 -44 C-82 -52 -48 -48 -24 -34 M-116 -22 C-82 -30 -48 -26 -24 -12" fill="none" stroke="#1E4D3B" stroke-width="4.5" stroke-linecap="round" opacity="0.28"/>
    <path d="M116 -44 C82 -52 48 -48 24 -34 M116 -22 C82 -30 48 -26 24 -12" fill="none" stroke="#1E4D3B" stroke-width="4.5" stroke-linecap="round" opacity="0.28"/>
    <!-- Gold book cradle & spine -->
    <path d="M-156 14 C-104 -4 -48 -2 0 26 C48 -2 104 -4 156 14" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-54" x2="0" y2="24" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Stylized Calligraphic Meem (م) rising above the open Qur'an -->
  <g transform="translate(256 178)">
    <!-- Gold halo diamond -->
    <circle cx="0" cy="-6" r="68" fill="#14372A" stroke="url(#gold)" stroke-width="4.5" opacity="0.95"/>
    <!-- Pure vector Arabic Meem (م) -->
    <path d="M-2 -34 C18 -34 32 -20 32 -2 C32 16 17 28 -2 28 C-17 28 -28 20 -32 8 C-34 2 -33 -10 -24 -20 C-17 -28 -10 -34 -2 -34 Z M0 -16 C-8 -16 -14 -9 -14 -1 C-14 7 -8 12 0 12 C9 12 15 6 15 -2 C15 -10 9 -16 0 -16 Z" fill="url(#gold)"/>
    <path d="M-30 10 L-30 56 C-30 62 -25 66 -19 66 C-13 66 -9 62 -9 56 L-9 22 Z" fill="url(#gold)"/>
  </g>

  <!-- Top & bottom accent dots -->
  <circle cx="256" cy="70" r="5.5" fill="url(#gold)" opacity="0.9"/>
  <circle cx="256" cy="436" r="5.5" fill="url(#gold)" opacity="0.9"/>
</svg>
